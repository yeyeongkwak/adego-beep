name: CI

on:
    pull_request:
    push:
        branches: [master, dev]

jobs:
    ci_build_and_validate:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout the repository code
              uses: actions/checkout@v5

            - name: Enable Corepack
              run: corepack enable

            - name: Setup Node
              uses: actions/setup-node@v5
              with:
                  node-version: 24

            - name: Create dummy .env
              run: |
                  echo "NEXT_PUBLIC_SUPABASE_URL=https://dummy.supabase.co" > .env
                  echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=dummy-publishable-key" >> .env
                  echo "NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=dummy-browser-maps-key" >> .env
                  echo "SUPABASE_URL=https://dummy.supabase.co" >> .env
                  echo "SUPABASE_SERVICE_ROLE_KEY=dummy-service-role-key" >> .env
                  echo "SUPABASE_SECRET_KEY=dummy-secret-key" >> .env
                  echo "GOOGLE_MAPS_API_KEY=dummy-server-maps-key" >> .env
                  echo "GTFS_DIR=./gtfs" >> .env
                  echo "DISCORD_WEBHOOK_URL_BUG=https://discord.com/api/webhooks/dummy/bug" >> .env
                  echo "DISCORD_WEBHOOK_URL_SUGGESTION=https://discord.com/api/webhooks/dummy/suggestion" >> .env

            - name: Install dependencies
              run: yarn install --immutable

            - name: Run lint check
              run: yarn lint

            - name: Run format check
              run: yarn prettier --check .

            - name: Build project
              run: yarn build

            - name: Send Discord notification on success
              if: success() && github.event_name == 'push'
              env:
                  WEBHOOK: ${{ secrets.DISCORD_BUILD_WEBHOOK }}
                  COMMIT_MSG: ${{ github.event.head_commit.message }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  jq -n \
                    --arg desc "Lint, format, and build succeeded on \`$REF_NAME\`." \
                    --arg msg "$COMMIT_MSG" \
                    --arg url "$RUN_URL" \
                    '{content: "✅ CI Passed", embeds: [{title: "Adelaide Go Beep — CI", description: ($desc + "\n\n" + $msg), url: $url, color: 3066993}]}' \
                    | curl -sf -X POST -H 'Content-Type: application/json' -d @- "$WEBHOOK"

            - name: Send Discord notification on failure
              if: failure() && github.event_name == 'push'
              env:
                  WEBHOOK: ${{ secrets.DISCORD_BUILD_WEBHOOK }}
                  COMMIT_MSG: ${{ github.event.head_commit.message }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  jq -n \
                    --arg desc "CI failed on \`$REF_NAME\`. Please check the logs." \
                    --arg msg "$COMMIT_MSG" \
                    --arg url "$RUN_URL" \
                    '{content: "❌ CI Failed", embeds: [{title: "Adelaide Go Beep — CI", description: ($desc + "\n\n" + $msg), url: $url, color: 16711680}]}' \
                    | curl -sf -X POST -H 'Content-Type: application/json' -d @- "$WEBHOOK"
