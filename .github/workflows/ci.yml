name: CI

on:
    pull_request:
    push:
        branches: [main, dev]

jobs:
    ci_build_and_validate:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout the repository code
              uses: actions/checkout@v4

            - name: Enable Corepack
              run: corepack enable

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: yarn

            - name: Create dummy .env
              run: |
                  echo "NEXT_PUBLIC_SUPABASE_URL=https://dummy.supabase.co" > .env
                  echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=dummy-publishable-key" >> .env
                  echo "NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=dummy-browser-maps-key" >> .env
                  echo "SUPABASE_URL=https://dummy.supabase.co" >> .env
                  echo "SUPABASE_SERVICE_ROLE_KEY=dummy-service-role-key" >> .env
                  echo "SUPABASE_SECRET_KEY=dummy-secret-key" >> .env
                  echo "GOOGLE_MAPS_API_KEY=dummy-server-maps-key" >> .env
                  echo "GTFS_DIR=./gtfs" >> .env
                  echo "DISCORD_WEBHOOK_URL_BUG=https://discord.com/api/webhooks/dummy/bug" >> .env
                  echo "DISCORD_WEBHOOK_URL_SUGGESTION=https://discord.com/api/webhooks/dummy/suggestion" >> .env

            - run: yarn install --immutable
            - run: yarn lint
            - run: npx prettier --check .
            - run: yarn build
